<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033" />
      <stop offset="100%" stop-color="#990022" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Play triangle outline subtle -->
  <path d="M42 36 L94 64 L42 92 Z" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" stroke-linejoin="round" />

  <!-- Audio Wave / Mic shape in center -->
  <g transform="translate(64, 56) scale(1.1)">
    <!-- Audio Wave lines -->
    <line x1="-30" y1="-8" x2="-30" y2="8" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="-20" y1="-18" x2="-20" y2="18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="-10" y1="-26" x2="-10" y2="26" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="-32" x2="0" y2="32" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <line x1="10" y1="-26" x2="10" y2="26" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="-18" x2="20" y2="18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="30" y1="-8" x2="30" y2="8" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Glowing Badge "AR" in bottom right -->
  <g transform="translate(62, 78)">
    <rect x="0" y="0" width="56" height="38" rx="10" fill="url(#badgeGrad)" filter="url(#shadow)" />
    <text x="28" y="26" font-family="Segoe UI, Tajawal, Arial, sans-serif" font-weight="900" font-size="20" fill="#0A192F" text-anchor="middle">AR</text>
  </g>
</svg>